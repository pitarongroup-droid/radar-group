<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ — Обзор</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/dashboard.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="admin-layout">

  <aside class="admin-sidebar">
    <a href="/admin/dashboard.html" class="admin-sidebar-logo">
      <img src="/images/logo.webp" alt="Radar" width="32" height="32">
      <span class="admin-sidebar-logo-text">ADMIN</span>
    </a>
    <nav class="admin-sidebar-nav">
      <a href="/admin/dashboard.html" class="admin-sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Обзор</span>
      </a>
      <a href="/admin/clients.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Клиенты</span>
      </a>
      <a href="/admin/logs.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Логи</span>
      </a>
      <a href="/admin/billing.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Финансы</span>
      </a>
    </nav>
    <div class="admin-sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Выйти</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">

    <header class="admin-header">
      <h1 class="admin-header-title">Обзор</h1>
      <div class="admin-header-actions">
        <a href="/admin/clients.html" class="btn btn-primary">+ Новый клиент</a>
      </div>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-label">Всего клиентов</div>
        <div class="stat-card-value" id="statClients">0</div>
        <div class="stat-card-meta">активных</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Диалогов</div>
        <div class="stat-card-value" id="statDialogs">0</div>
        <div class="stat-card-meta">за месяц</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Лидов</div>
        <div class="stat-card-value" id="statLeads">0</div>
        <div class="stat-card-meta">за месяц</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Выручка</div>
        <div class="stat-card-value" id="statRevenue">$0</div>
        <div class="stat-card-meta">в месяц</div>
      </div>
    </section>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Клиенты
        </h2>
        <a href="/admin/clients.html" class="dash-section-action">Все →</a>
      </div>

      <table class="clients-table">
        <thead>
          <tr>
            <th>Клиент</th>
            <th>План</th>
            <th>Статус</th>
            <th>Диалогов</th>
            <th>Лидов</th>
            <th>Выручка</th>
          </tr>
        </thead>
        <tbody id="clientsTableBody">
          <tr>
            <td colspan="6" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              <div>Пока нет клиентов</div>
              <div style="font-size: 12px; margin-top: 6px;">Создайте первого клиента в разделе «Клиенты»</div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

</div>

<script>
  // Проверка: только админ
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token || user.role !== 'admin') {
    window.location.href = '/app/login.html';
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/app/login.html';
  }

  // TODO: загрузка данных из /api/admin/dashboard
</script>

</body>
</html>
