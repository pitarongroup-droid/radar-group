<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ — Логи</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/dashboard.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-tab {
      padding: 8px 16px; background: transparent; border: 1px solid var(--border);
      border-radius: 100px; color: var(--text-muted); font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition);
    }
    .filter-tab:hover { color: var(--text); border-color: var(--border-strong); }
    .filter-tab.active {
      background: var(--gradient-cta); color: #FFFFFF; border-color: transparent;
      box-shadow: 0 4px 14px rgba(0, 240, 255, 0.25);
    }

    /* --- АДАПТИВНЫЕ ФИЛЬТРЫ --- */
    .filter-panel { margin-bottom: 15px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
    .filter-container { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filter-date-box { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .date-input { padding: 8px; width: 130px; color-scheme: dark; }
    @media (max-width: 768px) {
      .filter-container { flex-direction: column; align-items: stretch; }
      .filter-date-box { justify-content: space-between; margin-bottom: 10px; }
      .date-input { flex: 1; width: auto; min-width: 110px; }
      .filter-actions { justify-content: space-between; width: 100%; margin-left: 0 !important; }
      .filter-actions .btn { flex: 1; padding: 10px; font-size: 13px; }
      .filter-tabs { width: 100%; display: flex; overflow-x: auto; padding-bottom: 5px; margin-bottom: 5px; -webkit-overflow-scrolling: touch; }
      .filter-tabs::-webkit-scrollbar { display: none; }
      .filter-tab { flex-shrink: 0; padding: 8px 14px; font-size: 13px; }
    }
  </style>
</head>
<body class="page-logs">

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="/admin/dashboard.html" class="admin-sidebar-logo">
      <img src="/images/logo.webp" alt="Radar" width="32" height="32">
      <span class="admin-sidebar-logo-text">ADMIN</span>
    </a>
    <nav class="admin-sidebar-nav">
      <a href="/admin/dashboard.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Обзор</span>
      </a>
      <a href="/admin/clients.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <span>Клиенты</span>
      </a>
      <a href="/admin/partners.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg>
        <span>Партнеры</span>
      </a>
      <a href="/admin/logs.html" class="admin-sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Логи</span>
      </a>
      <a href="/admin/billing.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Финансы</span>
      </a>
    </nav>
    <div class="admin-sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Выйти</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 class="admin-header-title">Логи</h1>
    </header>

    <!-- ОБНОВЛЕННАЯ ПАНЕЛЬ ФИЛЬТРОВ -->
    <section class="filter-panel">
      <div class="filter-container">
        
        <div class="filter-tabs" id="quickFilters">
          <button class="filter-tab active" data-days="all">Всё время</button>
          <button class="filter-tab" data-days="1">Сегодня</button>
          <button class="filter-tab" data-days="7">7 дней</button>
          <button class="filter-tab" data-days="30">30 дней</button>
        </div>

        <div class="filter-date-box">
          <input type="date" id="dateFrom" class="form-input date-input">
          <span style="color:var(--text-muted);">—</span>
          <input type="date" id="dateTo" class="form-input date-input">
        </div>
        
        <div class="filter-actions" style="margin-left: auto;">
          <button class="btn btn-primary" onclick="loadLogs()">🔍 Применить</button>
          <button class="btn btn-outline" onclick="resetFilters()">Сбросить</button>
        </div>
      </div>
    </section>

    <section class="dash-section">
      <table class="clients-table">
        <thead>
          <tr>
            <th>Время</th>
            <th>Уровень</th>
            <th>Источник</th>
            <th>Сообщение</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr>
            <td colspan="4" class="empty-state">Загрузка...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<script>
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token || user.role !== 'admin') window.location.href = '/app/login.html';

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/app/login.html';
  }

  async function loadLogs() {
    const tbody = document.getElementById('logsBody');
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Загрузка...</td></tr>';

    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    
    const params = new URLSearchParams();
    params.append('limit', '100');
    if (dateFrom) params.append('date_from', dateFrom);
    if (dateTo) params.append('date_to', dateTo);

    try {
      const res = await fetch('/api/admin/logs?' + params.toString());
      const data = await res.json();
      if (!data.ok) throw new Error(data.error?.ru || 'Ошибка');

      if (!data.logs.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty-state">
              <div>Нет логов за выбранный период</div>
              <div style="font-size:12px; margin-top:6px; color:var(--text-dim);">
                Попробуйте изменить даты или сбросить фильтры
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = data.logs.map(log => {
        const time = new Date(log.created_at * 1000)
          .toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

        const levelClass = {
          error: 'status-suspended',
          warn: 'status-trial',
          info: 'status-active'
        }[log.level] || 'status-active';

        return `
          <tr>
            <td>${time}</td>
            <td><span class="status-badge ${levelClass}">${log.level || 'info'}</span></td>
            <td>${log.source || '—'}</td>
            <td style="font-family:monospace; font-size:12px;">${escapeHtml(log.message || '')}</td>
          </tr>
        `;
      }).join('');
    } catch (err) {
      console.error('Logs error:', err);
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="empty-state">
            <div>Ошибка загрузки</div>
            <div style="font-size:12px;">${escapeHtml(err.message)}</div>
          </td>
        </tr>
      `;
    }
  }

  document.querySelectorAll('#quickFilters .filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#quickFilters .filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const days = tab.dataset.days;
      const today = new Date();
      let dateFrom = null, dateTo = null;

      if (days === '1') {
        dateFrom = today.toISOString().split('T')[0];
        dateTo = dateFrom;
      } else if (days === '7') {
        const past = new Date();
        past.setDate(today.getDate() - 7);
        dateFrom = past.toISOString().split('T')[0];
        dateTo = today.toISOString().split('T')[0];
      } else if (days === '30') {
        const past = new Date();
        past.setDate(today.getDate() - 30);
        dateFrom = past.toISOString().split('T')[0];
        dateTo = today.toISOString().split('T')[0];
      }

      document.getElementById('dateFrom').value = dateFrom || '';
      document.getElementById('dateTo').value = dateTo || '';
      
      loadLogs();
    });
  });

  function resetFilters() {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    document.querySelectorAll('#quickFilters .filter-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('#quickFilters .filter-tab[data-days="all"]').classList.add('active');
    loadLogs();
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  loadLogs();
</script>

</body>
</html>
