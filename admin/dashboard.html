<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ — Обзор</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/dashboard.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-tab:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .filter-tab.active {
      background: var(--gradient-cta);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(0, 240, 255, 0.25);
    }
  </style>
</head>
<body class="page-dashboard">

<div class="admin-layout">

  <aside class="admin-sidebar">
    <a href="/admin/dashboard.html" class="admin-sidebar-logo">
      <img src="/images/logo.webp" alt="Radar" width="32" height="32">
      <span class="admin-sidebar-logo-text">ADMIN</span>
    </a>
    <nav class="admin-sidebar-nav">
      <a href="/admin/dashboard.html" class="admin-sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Обзор</span>
      </a>
      <a href="/admin/clients.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Клиенты</span>
      </a>
      <!-- ДОБАВЛЕНО: Партнеры -->
      <a href="/admin/partners.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg>
        <span>Партнеры</span>
      </a>
      <a href="/admin/logs.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Логи</span>
      </a>
      <a href="/admin/billing.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Финансы</span>
      </a>
    </nav>
    <div class="admin-sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Выйти</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">

    <header class="admin-header">
      <h1 class="admin-header-title">Обзор</h1>
      <div class="admin-header-actions">
        <a href="/admin/client.html" class="btn btn-primary">+ Новый клиент</a>
      </div>
    </header>

    <!-- ПАНЕЛЬ ФИЛЬТРОВ -->
    <section class="dash-section" style="margin-bottom: 15px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; border: 1px solid var(--border);">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        
        <div class="filter-tabs" id="quickFilters">
          <button class="filter-tab active" data-days="all">Всё время</button>
          <button class="filter-tab" data-days="1">Сегодня</button>
          <button class="filter-tab" data-days="7">7 дней</button>
          <button class="filter-tab" data-days="30">30 дней</button>
        </div>

        <div style="display:flex; gap:5px; align-items:center; margin-left: auto;">
          <input type="date" id="dashDateFrom" class="form-input" style="padding:8px; width:130px; color-scheme: dark;">
          <span style="color:var(--text-muted);">—</span>
          <input type="date" id="dashDateTo" class="form-input" style="padding:8px; width:130px; color-scheme: dark;">
          <button class="btn btn-primary" onclick="applyCustomDates()" style="padding:8px 16px;">🔍 Применить</button>
        </div>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-label">Всего клиентов</div>
        <div class="stat-card-value" id="statClients">0</div>
        <div class="stat-card-meta">активных</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Диалогов</div>
        <div class="stat-card-value" id="statDialogs">0</div>
        <div class="stat-card-meta meta-period-label">за месяц</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Лидов</div>
        <div class="stat-card-value" id="statLeads">0</div>
        <div class="stat-card-meta meta-period-label">за месяц</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Выручка</div>
        <div class="stat-card-value" id="statRevenue">0 BYN</div>
        <div class="stat-card-meta meta-period-label">за месяц</div>
      </div>
    </section>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Последние клиенты
        </h2>
        <a href="/admin/clients.html" class="dash-section-action">Все →</a>
      </div>

      <table class="clients-table">
        <thead>
          <tr>
            <th>Клиент</th>
            <th>План</th>
            <th>Статус</th>
            <th>Диалогов</th>
            <th>Лидов</th>
            <th>Выручка</th>
          </tr>
        </thead>
        <tbody id="clientsTableBody">
          <tr>
            <td colspan="6" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              <div>Загрузка...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>

</div>

<script>
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!token || user.role !== 'admin') {
    window.location.href = '/app/login.html';
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/app/login.html';
  }

  // Функция для загрузки данных (принимает даты)
  async function loadDashboard(dateFrom = null, dateTo = null) {
    try {
      // Формируем URL с датами
      const params = new URLSearchParams();
      if (dateFrom) params.append('date_from', dateFrom);
      if (dateTo) params.append('date_to', dateTo);

      const res = await fetch('/api/admin/dashboard?' + params.toString(), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error?.ru || 'Ошибка');

      // Заполняем карточки
      document.getElementById('statClients').textContent = data.stats.clients;
      document.getElementById('statDialogs').textContent = data.stats.dialogs;
      document.getElementById('statLeads').textContent = data.stats.leads;
      document.getElementById('statRevenue').textContent = Math.round(data.stats.revenue) + ' BYN';

      const tbody = document.getElementById('clientsTableBody');
      if (!data.recent_clients.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">
              <div>Пока нет клиентов</div>
              <div style="font-size:12px; margin-top:6px;">
                <a href="/admin/client.html" style="color:#00F0FF;">+ Создайте первого клиента</a>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      // Отрисовка таблицы
      tbody.innerHTML = data.recent_clients.map(c => {
        const statusClass = 'status-' + (c.status || 'active');
        const statusLabel = {
          active: '🟢 Активен',
          trial: '🟡 Trial',
          suspended: '🔴 Заблокирован',
          pending: '⏳ На проверке'
        }[c.status] || c.status;

        return `
          <tr style="cursor:pointer;" onclick="location.href='/admin/client.html?id=${c.id}'">
            <td>
              <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#00F0FF,#FF0080); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff;">
                  ${(c.name || '?').charAt(0).toUpperCase()}
                </div>
                <div>
                  <div style="color:#fff; font-weight:600;">${escapeHtml(c.name || '—')}</div>
                  <div style="font-size:12px; color:var(--text-dim);">${escapeHtml(c.email || '')}</div>
                </div>
              </div>
            </td>
            <td><span style="font-size:12px; font-weight:600; text-transform:uppercase;">${c.plan || 'basic'}</span></td>
            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
            <td>${c.dialogs_count || 0}</td>
            <td>${c.leads_count || 0}</td>
            <!-- ИЗМЕНЕНИЕ: Теперь выводится выручка клиента -->
            <td>${Math.round(c.total_revenue || 0)} BYN</td>
          </tr>
        `;
      }).join('');
    } catch (err) {
      console.error('Dashboard load error:', err);
    }
  }

  // Логика кнопок быстрых фильтров
  document.querySelectorAll('#quickFilters .filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      // Меняем активный класс
      document.querySelectorAll('#quickFilters .filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      // Очищаем календари
      document.getElementById('dashDateFrom').value = '';
      document.getElementById('dashDateTo').value = '';

      const days = tab.dataset.days;
      const today = new Date();
      let dateFrom = null, dateTo = null;
      let periodLabel = 'за всё время';

      if (days === '1') {
        dateFrom = today.toISOString().split('T')[0];
        dateTo = dateFrom;
        periodLabel = 'за сегодня';
      } else if (days === '7') {
        const past = new Date();
        past.setDate(today.getDate() - 7);
        dateFrom = past.toISOString().split('T')[0];
        dateTo = today.toISOString().split('T')[0];
        periodLabel = 'за 7 дней';
      } else if (days === '30') {
        const past = new Date();
        past.setDate(today.getDate() - 30);
        dateFrom = past.toISOString().split('T')[0];
        dateTo = today.toISOString().split('T')[0];
        periodLabel = 'за 30 дней';
      }

      // Обновляем текст под карточками
      document.querySelectorAll('.meta-period-label').forEach(el => el.textContent = periodLabel);

      // Загружаем
      loadDashboard(dateFrom, dateTo);
    });
  });

  // Логика кастомных дат
  function applyCustomDates() {
    const from = document.getElementById('dashDateFrom').value;
    const to = document.getElementById('dashDateTo').value;

    if (!from && !to) return;

    // Снимаем активность с быстрых кнопок
    document.querySelectorAll('#quickFilters .filter-tab').forEach(t => t.classList.remove('active'));

    // Обновляем текст
    document.querySelectorAll('.meta-period-label').forEach(el => el.textContent = 'за выбранный период');

    loadDashboard(from, to);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  // Инициализация при загрузке
  loadDashboard();
</script>

</body>
</html>
