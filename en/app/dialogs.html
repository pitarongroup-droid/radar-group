<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Dialogs — Radar Group</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/sidebar.css">
  <link rel="stylesheet" href="/app/dashboard.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <a href="/en/app/dashboard.html" class="sidebar-logo">
      <img src="/images/logo.webp" alt="Radar Group" width="32" height="32">
      <span class="sidebar-logo-text">RADAR</span>
    </a>
    <nav class="sidebar-nav">
      <a href="/en/app/dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/en/app/dialogs.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Dialogs</span>
      </a>
      <a href="/en/app/reports.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span>Reports</span>
      </a>
      <a href="/en/app/billing.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Billing</span>
      </a>
      <a href="/en/app/widget.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M12 16a4 4 0 0 0 4-4"/></svg>
        <span>Widget</span>
      </a>
      <a href="/en/app/bot.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
        <span>Telegram Bot</span>
      </a>
      <a href="/en/app/integration.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Integration</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <h1 class="app-header-title">Dialogs</h1>
      <div class="app-header-user">
        <div class="app-header-user-avatar" id="userAvatar">?</div>
        <span id="userName">Client</span>
      </div>
    </header>

    <section class="dash-section">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="leads">Leads</button>
        <button class="filter-tab" data-filter="active">Active</button>
      </div>
    </section>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          All Dialogs
        </h2>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Client</th>
            <th>Channel</th>
            <th>Messages</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="dialogsTable">
          <tr>
            <td colspan="5" class="empty-state">Loading...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<style>
  .filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-tab {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .filter-tab:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }
  .filter-tab.active {
    background: var(--gradient-cta);
    color: #FFFFFF;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(0, 240, 255, 0.25);
  }
</style>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/en/app/login.html';

  try {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) {
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
  } catch (e) {}

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/en/app/login.html';
  }

  let currentFilter = 'all';

  async function loadDialogs() {
    const tbody = document.getElementById('dialogsTable');
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Loading...</td></tr>';

    try {
      const res = await fetch('/api/dialogs?filter=' + currentFilter, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error?.en || 'Error');

      if (!data.dialogs.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <div>No dialogs yet</div>
              <div style="font-size: 12px; margin-top: 6px; color: var(--text-dim);">
                As soon as clients start messaging — dialogs will appear here
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = data.dialogs.map(d => {
        const date = new Date(d.created_at * 1000)
          .toLocaleDateString('en-US', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

        const channelLabel = {
          widget: '🌐 Website',
          telegram: '💬 Telegram',
          whatsapp: '📱 WhatsApp'
        }[d.channel] || d.channel;

        const badge = d.is_lead
          ? '<span class="badge badge-success">Lead</span>'
          : '<span class="badge badge-warning">Dialog</span>';

        return `
          <tr>
            <td>${date}</td>
            <td>${escapeHtml(d.user_name || 'Client')}</td>
            <td>${channelLabel}</td>
            <td>${d.messages_count}</td>
            <td>${badge}</td>
          </tr>
        `;
      }).join('');
    } catch (err) {
      console.error('Dialogs error:', err);
      tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Error: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      loadDialogs();
    });
  });

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  loadDialogs();
</script>

</body>
</html>
