<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <title>Стать партнером — Radar Group</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body class="app-body">

  <div class="app-container">
    <div class="app-card">
      <a href="/" class="app-logo">
        <img src="/images/logo.webp" alt="Radar Group" width="40" height="40">
        <span class="logo-text">RADAR PARTNER</span>
      </a>

      <h1 class="app-title">Стать партнером</h1>
      <p class="app-subtitle">Приводите клиентов и получайте до 10% с каждого их платежа</p>

      <form id="registerForm" class="app-form" novalidate>
        
        <div class="form-row">
          <label class="form-label" for="name">Ваше имя *</label>
          <input class="form-input" type="text" id="name" name="name" placeholder="Иван" required maxlength="50">
        </div>

        <div class="form-row">
          <label class="form-label" for="email">Email *</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
        </div>

        <div class="form-row">
          <label class="form-label" for="password">Пароль *</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Минимум 8 символов" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary form-submit">
          Зарегистрироваться
        </button>

        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
      </form>

      <div class="app-footer">
        Уже есть аккаунт партнера? <a href="/app/partner/login.html">Войти</a>
      </div>
      <div class="app-footer-secondary">
        <a href="/">← На главную</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const status = document.getElementById('formStatus');
      const btn = e.target.querySelector('button[type="submit"]');
      
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!name || !email || !password) {
        status.className = 'form-status error';
        status.textContent = 'Заполните все поля';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Создаем аккаунт...';
      status.className = 'form-status';
      status.textContent = '';

      try {
        const res = await fetch('/api/auth/partner-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();

        if (data.ok && data.token) {
          localStorage.setItem('partner_token', data.token);
          localStorage.setItem('partner_user', JSON.stringify(data.user));
          
          status.className = 'form-status success';
          status.textContent = '✅ Аккаунт создан! Перенаправляем в кабинет...';
          
          setTimeout(() => {
            window.location.href = '/app/partner/dashboard.html';
          }, 1000);
        } else {
          status.className = 'form-status error';
          status.textContent = data.error?.ru || 'Ошибка регистрации';
        }
      } catch (err) {
        status.className = 'form-status error';
        status.textContent = 'Ошибка сети. Попробуйте позже.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Зарегистрироваться';
      }
    });
  </script>

</body>
</html>
