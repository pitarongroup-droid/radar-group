<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <title>Вход для партнеров — Radar Group</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body class="app-body">

  <div class="app-container">
    <div class="app-card">
      <a href="/" class="app-logo">
        <img src="/images/logo.webp" alt="Radar Group" width="40" height="40">
        <span class="logo-text">RADAR PARTNER</span>
      </a>

      <h1 class="app-title">Вход для партнеров</h1>
      <p class="app-subtitle">Управляйте своими клиентами и заработком</p>

      <form id="loginForm" class="app-form" novalidate>
        <div class="form-row">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
        </div>

        <div class="form-row">
          <label class="form-label" for="password">Пароль</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary form-submit">Войти</button>
        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
      </form>

      <!-- ДОБАВЛЕНО: Ссылка на регистрацию партнера -->
      <div class="app-footer" style="margin-top: 20px;">
        У вас еще нет аккаунта партнера? <a href="/app/partner/join.html" style="font-weight: 700;">Стать партнером</a>
      </div>
      
      <div class="app-footer-secondary">
        <a href="/">← На главную</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('formStatus');
      const btn = e.target.querySelector('button[type="submit"]');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        status.className = 'form-status error';
        status.textContent = 'Заполните все поля';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Входим...';

      try {
        const res = await fetch('/api/auth/partner-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.ok && data.token) {
          localStorage.setItem('partner_token', data.token);
          localStorage.setItem('partner_user', JSON.stringify(data.user));
          
          status.className = 'form-status success';
          status.textContent = 'Успешно! Перенаправляем...';
          
          setTimeout(() => {
            window.location.href = '/app/partner/dashboard.html';
          }, 500);
        } else {
          status.className = 'form-status error';
          status.textContent = data.error?.ru || 'Ошибка входа';
        }
      } catch (err) {
        status.className = 'form-status error';
        status.textContent = 'Ошибка сети.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
