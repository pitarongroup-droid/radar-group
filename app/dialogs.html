<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Диалоги — Radar Group</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/sidebar.css">
  <link rel="stylesheet" href="/app/dashboard.css">
</head>
<body class="page-dialogs">

<div class="app-layout">
  <aside class="sidebar">
    <a href="/app/dashboard.html" class="sidebar-logo">
      <img src="/images/logo.webp" alt="Radar Group" width="32" height="32">
      <span class="sidebar-logo-text">RADAR</span>
    </a>
    <nav class="sidebar-nav">
      <a href="/app/dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Дашборд</span>
      </a>
      <a href="/app/dialogs.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Диалоги</span>
      </a>
      <a href="/app/reports.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span>Отчёты</span>
      </a>
      <a href="/app/billing.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Оплаты</span>
      </a>
      <a href="/app/widget.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M12 16a4 4 0 0 0 4-4"/></svg>
        <span>Виджет</span>
      </a>
      <a href="/app/bot.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
        <span>Telegram-бот</span>
      </a>
      <a href="/app/integration.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Интеграция</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Выйти</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <h1 class="app-header-title">Диалоги</h1>
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="/app/help.html" class="app-help-btn" title="База знаний">?</a>
        <div class="app-header-user">
          <div class="app-header-user-avatar" id="userAvatar">?</div>
          <span id="userName">Клиент</span>
        </div>
      </div>
    </header>

    <!-- ПАНЕЛЬ ФИЛЬТРОВ -->
    <section class="dash-section" style="margin-bottom: 15px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; border: 1px solid var(--border);">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        
        <!-- НОВЫЕ КНОПКИ БЫСТРОГО ВЫБОРА -->
        <div class="filter-tabs" id="quickFilters" style="margin-right: 10px;">
          <button class="filter-tab active" data-days="all">Всё время</button>
          <button class="filter-tab" data-days="1">Сегодня</button>
          <button class="filter-tab" data-days="7">7 дней</button>
          <button class="filter-tab" data-days="30">30 дней</button>
        </div>

        <div style="display:flex; gap:5px; align-items:center;">
          <input type="date" id="dateFrom" class="form-input" style="padding:8px; width:130px; color-scheme: dark;">
          <span style="color:var(--text-muted);">—</span>
          <input type="date" id="dateTo" class="form-input" style="padding:8px; width:130px; color-scheme: dark;">
        </div>
        
        <input type="text" id="searchText" class="form-input" placeholder="Поиск по имени или контакту..." style="flex:1; min-width:200px; padding:8px;">
        <button class="btn btn-primary" onclick="loadDialogs()" style="padding:8px 16px;">🔍 Применить</button>
        <button class="btn btn-outline" onclick="resetFilters()" style="padding:8px 16px;">Сбросить</button>
      </div>
    </section>

    <section class="dash-section">
      <div class="filter-tabs">
        <button class="filter-tab" data-filter="all">Все</button>
        <button class="filter-tab" data-filter="leads">Лиды</button>
        <button class="filter-tab" data-filter="active">Активные</button>
      </div>
    </section>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Все диалоги
        </h2>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Клиент</th>
            <th>Канал</th>
            <th>Сообщений</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="dialogsTable">
          <tr>
            <td colspan="5" class="empty-state">Загрузка...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<style>
  .filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-tab {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .filter-tab:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }
  .filter-tab.active {
    background: var(--gradient-cta);
    color: #FFFFFF;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(0, 240, 255, 0.25);
  }
</style>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/app/login.html';

  try {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) {
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
  } catch (e) {}

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/app/login.html';
  }

  let currentFilter = 'all';

  async function loadDialogs() {
    const tbody = document.getElementById('dialogsTable');
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Загрузка...</td></tr>';

    // Собираем данные с фильтров
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    const searchText = document.getElementById('searchText').value;

    // Формируем URL
    const params = new URLSearchParams();
    params.append('filter', currentFilter);
    if (dateFrom) params.append('date_from', dateFrom);
    if (dateTo) params.append('date_to', dateTo);
    if (searchText) params.append('search', searchText);

    try {
      const res = await fetch('/api/dialogs?' + params.toString(), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error?.ru || 'Ошибка');

      if (!data.dialogs.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <div>Пока нет диалогов</div>
              <div style="font-size: 12px; margin-top: 6px; color: var(--text-dim);">
                Попробуйте изменить фильтры или период
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = data.dialogs.map(d => {
        let dateObj;
        if (typeof d.created_at === 'string' && (d.created_at.includes('-') || d.created_at.includes('T'))) {
          dateObj = new Date(d.created_at);
        } else {
          dateObj = new Date(d.created_at * 1000);
        }
        
        const date = isNaN(dateObj.getTime()) 
          ? '—' 
          : dateObj.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

        const channelLabel = {
          widget: '🌐 Сайт',
          telegram: '💬 Telegram',
          telegram_business: '💼 Telegram Business',
          whatsapp: '📱 WhatsApp'
        }[d.channel] || d.channel;

        const badge = d.is_lead
          ? '<span class="badge badge-success">Лид</span>'
          : '<span class="badge badge-warning">Диалог</span>';

        return `
          <tr style="cursor:pointer;" onclick="location.href='/app/dialog.html?id=${d.id}'">
            <td>${date}</td>
            <td>${escapeHtml(d.user_name || 'Клиент')}</td>
            <td>${channelLabel}</td>
            <td>${d.messages_count}</td>
            <td>${badge}</td>
          </tr>
        `;
      }).join('');
    } catch (err) {
      console.error('Dialogs error:', err);
      tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Ошибка: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  // Обработка быстрых кнопок
  document.querySelectorAll('#quickFilters .filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#quickFilters .filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const days = tab.dataset.days;
      const today = new Date();
      let dateFrom = null, dateTo = null;

      if (days === '1') {
        dateFrom = today.toISOString().split('T')[0];
        dateTo = dateFrom;
      } else if (days === '7') {
        const past = new Date();
        past.setDate(today.getDate() - 7);
        dateFrom = past.toISOString().split('T')[0];
        dateTo = today.toISOString().split('T')[0];
      } else if (days === '30') {
        const past = new Date();
        past.setDate(today.getDate() - 30);
        dateFrom = past.toISOString().split('T')[0];
        dateTo = today.toISOString().split('T')[0];
      }

      // Автоматически подставляем даты в календари
      document.getElementById('dateFrom').value = dateFrom || '';
      document.getElementById('dateTo').value = dateTo || '';
      
      // Загружаем данные
      loadDialogs();
    });
  });

  // Обработка табов (Лиды/Все)
  document.querySelectorAll('.filter-tab[data-filter]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab[data-filter]').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      loadDialogs();
    });
  });

  function resetFilters() {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    document.getElementById('searchText').value = '';
    document.querySelectorAll('#quickFilters .filter-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('#quickFilters .filter-tab[data-days="all"]').classList.add('active');
    loadDialogs();
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  loadDialogs();
</script>
<script src="/app-lang.js" defer></script>
</body>
</html>
