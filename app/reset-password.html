<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Новый пароль — Radar Group</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body class="app-body">
  <div class="app-container">
    <div class="app-card">
      <a href="/" class="app-logo">
        <img src="/images/logo.webp" alt="Radar Group" width="40" height="40">
        <span class="logo-text">RADAR GROUP</span>
      </a>
      <h1 class="app-title">Новый пароль</h1>
      
      <form id="resetForm" class="app-form">
        <div class="form-row">
          <label class="form-label">Придумайте новый пароль *</label>
          <input class="form-input" type="password" id="password" placeholder="Минимум 8 символов" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary form-submit">Сменить пароль</button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('resetForm').innerHTML = '<div class="form-status error" style="display:block;">Ошибка: отсутствует токен. Запросите ссылку заново.</div>';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('formStatus');
      const btn = e.target.querySelector('button[type="submit"]');
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Меняем...';
      status.className = 'form-status';
      status.textContent = '';

      try {
        const res = await fetch('/api/auth/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (data.ok) {
          status.className = 'form-status success';
          status.textContent = '✅ Пароль изменён! Перенаправляем на вход...';
          setTimeout(() => window.location.href = '/app/login.html', 2000);
        } else {
          status.className = 'form-status error';
          status.textContent = data.error?.ru || 'Ошибка';
        }
      } catch (err) {
        status.className = 'form-status error';
        status.textContent = 'Ошибка сети';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Сменить пароль';
      }
    });
  </script>
</body>
</html>
