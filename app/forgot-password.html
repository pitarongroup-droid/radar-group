<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Восстановление пароля — Radar Group</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body class="app-body">
  <div class="app-container">
    <div class="app-card">
      <a href="/" class="app-logo">
        <img src="/images/logo.webp" alt="Radar Group" width="40" height="40">
        <span class="logo-text">RADAR GROUP</span>
      </a>
      <h1 class="app-title">Сброс пароля</h1>
      <p class="app-subtitle">Введите email, указанный при регистрации</p>
      
      <form id="forgotForm" class="app-form">
        <div class="form-row">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary form-submit">Отправить ссылку</button>
        <div class="form-status" id="formStatus"></div>
      </form>

      <div class="app-footer">
        <a href="/app/login.html">← Вернуться к входу</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('formStatus');
      const btn = e.target.querySelector('button[type="submit"]');
      const email = document.getElementById('email').value.trim();

      btn.disabled = true;
      btn.textContent = 'Отправляем...';
      status.className = 'form-status';
      status.textContent = '';

      try {
        const res = await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.ok) {
          status.className = 'form-status success';
          status.textContent = '✅ Ссылка для сброса отправлена в Telegram!';
        } else {
          status.className = 'form-status error';
          status.textContent = data.error?.ru || 'Ошибка';
        }
      } catch (err) {
        status.className = 'form-status error';
        status.textContent = 'Ошибка сети';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Отправить ссылку';
      }
    });
  </script>
</body>
</html>
