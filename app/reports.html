<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Отчёты — Radar Group</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/sidebar.css">
  <link rel="stylesheet" href="/app/dashboard.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <a href="/app/dashboard.html" class="sidebar-logo">
      <img src="/images/logo.webp" alt="Radar Group" width="32" height="32">
      <span class="sidebar-logo-text">RADAR</span>
    </a>
    <nav class="sidebar-nav">
      <a href="/app/dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Дашборд</span>
      </a>
      <a href="/app/dialogs.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Диалоги</span>
      </a>
      <a href="/app/reports.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span>Отчёты</span>
      </a>
      <a href="/app/billing.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Оплаты</span>
      </a>
      <a href="/app/widget.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M12 16a4 4 0 0 0 4-4"/></svg>
        <span>Виджет</span>
      </a>
      <a href="/app/bot.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
        <span>Telegram-бот</span>
      </a>
      <a href="/app/integration.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Интеграция</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Выйти</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <h1 class="app-header-title">Отчёты</h1>
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="/app/help.html" class="app-help-btn" title="База знаний">?</a>
        <div class="app-header-user">
          <div class="app-header-user-avatar" id="userAvatar">?</div>
          <span id="userName">Клиент</span>
        </div>
      </div>
    </header>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg>
          Воронка продаж
        </h2>
      </div>

      <div class="funnel">
        <div class="funnel-step">
          <div class="funnel-label">Открыли чат</div>
          <div class="funnel-bar" id="barChat" style="width: 100%;">
            <span id="funnelChat">0</span>
          </div>
        </div>
        <div class="funnel-step">
          <div class="funnel-label">Написали боту</div>
          <div class="funnel-bar" id="barDialogs" style="width: 60%;">
            <span id="funnelDialogs">0</span>
          </div>
        </div>
        <div class="funnel-step">
          <div class="funnel-label">Оставили контакт</div>
          <div class="funnel-bar" id="barLeads" style="width: 25%;">
            <span id="funnelLeads">0</span>
          </div>
        </div>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-label">Лидов сегодня</div>
        <div class="stat-card-value" id="metricLeadsToday">0</div>
        <div class="stat-card-meta">за сегодня</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Конверсия</div>
        <div class="stat-card-value" id="metricConversion">0%</div>
        <div class="stat-card-meta">диалог → лид</div>
      </div>
    </section>
  </main>
</div>

<style>
  .funnel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .funnel-step {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .funnel-label {
    width: 160px;
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .funnel-bar {
    flex: 1;
    height: 44px;
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.15), rgba(168, 85, 247, 0.1));
    border-left: 3px solid var(--cyan);
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    color: var(--text);
    font-weight: 800;
    font-size: 18px;
    transition: var(--transition);
    min-width: 80px;
  }
  .funnel-bar:hover {
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.25), rgba(168, 85, 247, 0.15));
  }
  @media (max-width: 640px) {
    .funnel-step {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .funnel-label {
      width: 100%;
      font-size: 12px;
    }
    .funnel-bar {
      height: 40px;
      font-size: 16px;
    }
  }
</style>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/app/login.html';

  try {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) {
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
  } catch (e) {}

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/app/login.html';
  }

  async function loadFunnel() {
    try {
      const res = await fetch('/api/dashboard/funnel', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error?.ru || 'Ошибка');

      document.getElementById('funnelChat').textContent = data.funnel.chat_opened;
      document.getElementById('funnelDialogs').textContent = data.funnel.dialogs;
      document.getElementById('funnelLeads').textContent = data.funnel.leads;

      const max = Math.max(data.funnel.chat_opened, 1);
      const widthChat = Math.max((data.funnel.chat_opened / max) * 100, 10);
      const widthDialogs = Math.max((data.funnel.dialogs / max) * 100, 10);
      const widthLeads = Math.max((data.funnel.leads / max) * 100, 10);

      document.getElementById('barChat').style.width = widthChat + '%';
      document.getElementById('barDialogs').style.width = widthDialogs + '%';
      document.getElementById('barLeads').style.width = widthLeads + '%';

      document.getElementById('metricLeadsToday').textContent = data.metrics.leads_today;
      document.getElementById('metricConversion').textContent = data.metrics.conversion + '%';
    } catch (err) {
      console.error('Funnel load error:', err);
    }
  }

  loadFunnel();
</script>
<script src="/app-lang.js" defer></script>
</body>
</html>
