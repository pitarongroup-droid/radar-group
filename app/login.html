<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  
  <title>Вход в кабинет — Radar Group</title>
  
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body class="app-body">

  <div class="app-container">
    <div class="app-card">
      
      <a href="/" class="app-logo">
        <img src="/images/logo.webp" alt="Radar Group" width="40" height="40">
        <span class="logo-text">RADAR GROUP</span>
      </a>
      
      <h1 class="app-title">Вход в кабинет</h1>
      <p class="app-subtitle">Управление ИИ-менеджером</p>
      
      <form id="loginForm" class="app-form" novalidate>
        
        <div class="form-row">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        
        <div class="form-row">
          <label class="form-label" for="password">Пароль</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" minlength="8">
        </div>
        
        <button type="submit" class="btn btn-primary form-submit">
          Войти
        </button>
        
        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
      </form>
      
      <div class="app-footer">
        Нет аккаунта? <a href="/app/register.html">Зарегистрироваться</a>
      </div>
      
      <div class="app-footer-secondary">
        <a href="/">← На главную</a>
      </div>
      
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const status = document.getElementById('formStatus');
      const btn = e.target.querySelector('button[type="submit"]');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      const lang = window.location.pathname.startsWith('/en/') ? 'en' : 'ru';
      
      if (!email || !password) {
        status.className = 'form-status error';
        status.textContent = lang === 'en' ? 'Fill all fields' : 'Заполните все поля';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = lang === 'en' ? 'Signing in...' : 'Входим...';
      status.className = 'form-status';
      status.textContent = '';
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (data.ok && data.token) {
          // ✅ Сохраняем токен И данные пользователя
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          document.cookie = `token=${data.token}; path=/; max-age=${60*60*24*30}; SameSite=Lax`;
          
          // ✅ Языко-зависимый редирект
          const appRoot = lang === 'en' ? '/en/app' : '/app';
          
          status.className = 'form-status success';
          status.textContent = lang === 'en'
            ? 'Success! Redirecting...'
            : 'Успешно! Перенаправляем...';
          
          setTimeout(() => {
            window.location.href = `${appRoot}/dashboard.html`;
          }, 700);
        } else {
          status.className = 'form-status error';
          status.textContent = data.error?.[lang] || (lang === 'en' ? 'Login error' : 'Ошибка входа');
        }
      } catch (err) {
        status.className = 'form-status error';
        status.textContent = lang === 'en'
          ? 'Network error. Try again later.'
          : 'Ошибка сети. Попробуйте позже.';
        console.error('Login error:', err);
      } finally {
        btn.disabled = false;
        btn.textContent = lang === 'en' ? 'Sign in' : 'Войти';
      }
    });
  </script>

</body>
</html>
