<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Оплаты — Radar Group</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/sidebar.css">
  <link rel="stylesheet" href="/app/dashboard.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <a href="/app/dashboard.html" class="sidebar-logo">
      <img src="/images/logo.webp" alt="Radar Group" width="32" height="32">
      <span class="sidebar-logo-text">RADAR</span>
    </a>
    <nav class="sidebar-nav">
      <a href="/app/dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Дашборд</span>
      </a>
      <a href="/app/dialogs.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Диалоги</span>
      </a>
      <a href="/app/reports.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span>Отчёты</span>
      </a>
      <a href="/app/billing.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Оплаты</span>
      </a>
      <a href="/app/settings.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>
        <span>Настройки</span>
      </a>
      <a href="/app/integration.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Интеграция</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Выйти</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <h1 class="app-header-title">Оплаты</h1>
      <div class="app-header-user">
        <div class="app-header-user-avatar" id="userAvatar">?</div>
        <span id="userName">Клиент</span>
      </div>
    </header>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Текущий тариф
        </h2>
      </div>

      <div class="plan-info">
        <div class="plan-info-row">
          <span>План:</span>
          <strong>Standard</strong>
        </div>
        <div class="plan-info-row">
          <span>Стоимость:</span>
          <strong>$250/мес</strong>
        </div>
        <div class="plan-info-row">
          <span>Оплачен до:</span>
          <strong>—</strong>
        </div>
      </div>

      <button class="btn btn-primary" style="margin-top: 20px; width: 100%;" onclick="alert('Оплата будет подключена позже')">
        Оплатить $250
      </button>
    </section>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
          История платежей
        </h2>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4" class="empty-state">
              Пока нет платежей
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<style>
  .plan-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .plan-info-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .plan-info-row:last-child { border-bottom: none; }
  .plan-info-row span { color: var(--text-muted); }
  .plan-info-row strong { color: var(--text); font-weight: 700; }
</style>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/app/login.html';

  try {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) {
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
  } catch (e) {}

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/app/login.html';
  }
</script>

</body>
</html>
