<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080F">
  <meta name="robots" content="noindex, nofollow">
  <title>Настройки — Radar Group</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/app/sidebar.css">
  <link rel="stylesheet" href="/app/dashboard.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar">
    <a href="/app/dashboard.html" class="sidebar-logo">
      <img src="/images/logo.webp" alt="Radar Group" width="32" height="32">
      <span class="sidebar-logo-text">RADAR</span>
    </a>
    <nav class="sidebar-nav">
      <a href="/app/dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Дашборд</span>
      </a>
      <a href="/app/dialogs.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Диалоги</span>
      </a>
      <a href="/app/reports.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span>Отчёты</span>
      </a>
      <a href="/app/billing.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Оплаты</span>
      </a>
      <a href="/app/settings.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Настройки</span>
      </a>
      <a href="/app/integration.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Интеграция</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Выйти</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <h1 class="app-header-title">Настройки</h1>
      <div class="app-header-user">
        <div class="app-header-user-avatar" id="userAvatar">?</div>
        <span id="userName">Клиент</span>
      </div>
    </header>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M12 16a4 4 0 0 0 4-4"/></svg>
          Настройки виджета
        </h2>
      </div>

      <div class="settings-form">
        <div class="form-row">
          <label class="form-label" for="widgetTitle">Заголовок виджета</label>
          <input class="form-input" type="text" id="widgetTitle" value="ИИ-менеджер" maxlength="50">
        </div>

        <div class="form-row">
          <label class="form-label" for="widgetWelcome">Приветствие</label>
          <textarea class="form-textarea" id="widgetWelcome" maxlength="300">Здравствуйте! Чем помочь?</textarea>
        </div>

        <div class="form-row">
          <label class="form-label" for="widgetColor">Цвет кнопки</label>
          <div class="color-picker-row">
            <input class="form-input color-input" type="color" id="widgetColor" value="#00F0FF">
            <input class="form-input" type="text" id="widgetColorText" value="#00F0FF" maxlength="7">
          </div>
        </div>

        <div class="form-row">
          <label class="form-label" for="widgetPosition">Позиция</label>
          <select class="form-input" id="widgetPosition">
            <option value="right">Справа снизу</option>
            <option value="left">Слева снизу</option>
          </select>
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-top: 12px;" onclick="saveSettings()">
          Сохранить настройки
        </button>

        <div class="form-status" id="formStatus"></div>
      </div>
    </section>

    <section class="dash-section">
      <div class="dash-section-header">
        <h2 class="dash-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Промпт для ИИ
        </h2>
      </div>

      <div class="settings-form">
        <div class="form-row">
          <label class="form-label" for="prompt">
            Инструкция для ИИ-менеджера
            <span style="color: var(--text-dim); font-weight: 400;">(что продавать, как общаться)</span>
          </label>
          <textarea class="form-textarea" id="prompt" style="min-height: 200px;" maxlength="5000"
            placeholder="Ты — ИИ-менеджер компании...&#10;&#10;Твоя задача — продавать...&#10;&#10;Отвечай клиентам так..."></textarea>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="savePrompt()">
          Сохранить промпт
        </button>

        <div class="form-status" id="promptStatus"></div>
      </div>
    </section>
  </main>
</div>

<style>
  .settings-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .color-picker-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .color-input {
    width: 60px;
    height: 44px;
    padding: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .color-picker-row .form-input:not(.color-input) {
    flex: 1;
  }
</style>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/app/login.html';

  try {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name) {
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }
  } catch (e) {}

  // Синхронизация color picker
  const colorInput = document.getElementById('widgetColor');
  const colorText = document.getElementById('widgetColorText');

  colorInput.addEventListener('input', () => {
    colorText.value = colorInput.value.toUpperCase();
  });
  colorText.addEventListener('input', () => {
    const val = colorText.value.trim();
    if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
      colorInput.value = val;
    }
  });

  function saveSettings() {
    const status = document.getElementById('formStatus');
    status.className = 'form-status success';
    status.textContent = 'Настройки сохранены (демо)';
    setTimeout(() => { status.className = 'form-status'; }, 3000);
  }

  function savePrompt() {
    const status = document.getElementById('promptStatus');
    status.className = 'form-status success';
    status.textContent = 'Промпт сохранён (демо)';
    setTimeout(() => { status.className = 'form-status'; }, 3000);
  }

  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    document.cookie = 'token=; path=/; max-age=0';
    window.location.href = '/app/login.html';
  }
</script>

</body>
</html>
